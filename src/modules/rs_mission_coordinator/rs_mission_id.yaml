module_name: rs_mission_coordinator

parameters:
    - group: mission_id
      definitions:
        RS_MISSION_ID:
          description:
            short: rs_mission_id
            long: Mission selected for the vehicle and reported to the companion computer. Select Off when no mission should run.
          type: enum
          values:
            0: Off - no mission selected
            1: Manual mission
            2: Manual ArUco mission
            3: Follow pipe mission
          default: 0
          min: 0
          max: 3
          category: Robosub
